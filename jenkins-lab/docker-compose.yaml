version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    user: root
    ports:
      - "8080:8080" # Porta da Interface Web
      - "50000:50000" # Porta de comunicacao interna dos agentes
    volumes:
      - jenkins_data:/var/jenkins_home
      # Permite o "Docker in Docker"
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_data:
